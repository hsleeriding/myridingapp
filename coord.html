<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카카오맵 좌표 주소 확인기</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f6f8;
    --panel: #ffffff;
    --border: #dfe3e8;
    --text: #202124;
    --muted: #6b7280;
    --accent: #1769e0;
    --danger: #d93025;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Noto Sans KR", sans-serif;
    color: var(--text);
    background: var(--bg);
  }

  body {
    display: flex;
    flex-direction: column;
  }

  header {
    height: 52px;
    flex: 0 0 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px 0 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .title {
    font-size: 16px;
    font-weight: 700;
  }

  .subtitle {
    margin-left: 10px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 400;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  button {
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    color: var(--text);
    padding: 7px 10px;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
  }

  button:hover {
    background: #f7f8fa;
  }

  button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  button.primary:hover {
    filter: brightness(0.96);
  }

  button.danger {
    color: var(--danger);
  }

  #map {
    position: relative;
    width: 100%;
    height: calc(100% - 52px);
    flex: 1 1 auto;
    background: #e9ecef;
  }

  .map-placeholder {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 14px;
    z-index: 1;
    pointer-events: none;
  }

  .address-overlay {
    min-width: 260px;
    max-width: 420px;
    padding: 11px 14px;
    border: 1px solid rgba(0,0,0,.12);
    border-radius: 10px;
    background: rgba(255,255,255,.97);
    box-shadow: 0 4px 18px rgba(0,0,0,.18);
    font-size: 13px;
    line-height: 1.5;
  }

  .address-overlay .heading {
    margin-bottom: 4px;
    font-weight: 700;
    font-size: 12px;
    color: #555;
  }

  .address-overlay .row {
    margin-top: 2px;
    word-break: keep-all;
  }

  .address-overlay .label {
    display: inline-block;
    width: 58px;
    color: #777;
  }

  .address-overlay .coords {
    margin-top: 7px;
    padding-top: 7px;
    border-top: 1px solid #eee;
    color: #888;
    font-size: 11px;
  }

  .status {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 10;
    padding: 7px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,.92);
    border: 1px solid rgba(0,0,0,.08);
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    font-size: 12px;
    color: #555;
    pointer-events: none;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.46);
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal {
    width: min(520px, calc(100vw - 32px));
    border-radius: 14px;
    background: white;
    box-shadow: 0 18px 60px rgba(0,0,0,.28);
    overflow: hidden;
  }

  .modal-header {
    padding: 18px 20px 10px;
    font-size: 18px;
    font-weight: 800;
  }

  .modal-body {
    padding: 6px 20px 18px;
  }

  .modal-body p {
    margin: 8px 0 14px;
    color: #555;
    font-size: 13px;
    line-height: 1.55;
  }

  .field-label {
    display: block;
    margin-bottom: 7px;
    font-size: 12px;
    font-weight: 700;
  }

  .key-input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #cfd5dc;
    border-radius: 8px;
    outline: none;
    font: inherit;
    font-size: 13px;
  }

  .key-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(23,105,224,.12);
  }

  .help {
    margin-top: 8px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
  }

  .error {
    min-height: 18px;
    margin-top: 8px;
    color: var(--danger);
    font-size: 12px;
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 20px 18px;
  }

  .hidden {
    display: none !important;
  }
</style>
</head>
<body>

<header>
  <div>
    <span class="title">카카오맵 좌표 주소 확인기</span>
    <span class="subtitle">지도에서 우클릭하면 해당 지점의 주소를 표시합니다.</span>
  </div>
  <div class="header-actions">
    <button id="changeKeyBtn">API Key 변경</button>
  </div>
</header>

<div id="map">
  <div id="mapPlaceholder" class="map-placeholder">카카오맵을 불러오는 중...</div>
  <div id="status" class="status">준비 중</div>
</div>

<div id="keyModalBackdrop" class="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="keyModalTitle">
    <div id="keyModalTitle" class="modal-header">카카오맵 API Key 입력</div>
    <div class="modal-body">
      <p>
        카카오 개발자사이트에서 발급받은 <b>JavaScript Key</b>를 입력하세요.
        입력한 값은 이 브라우저의 IndexedDB에 저장되어 다음 실행부터 자동으로 사용합니다.
      </p>

      <label class="field-label" for="keyInput">JavaScript Key</label>
      <input
        id="keyInput"
        class="key-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="JavaScript Key를 입력하세요"
      >

      <div id="keyError" class="error"></div>

      <div class="help">
        ※ Kakao Developers에서 Web 도메인을 등록해야 합니다.
        로컬 파일(file://)에서 동작하지 않으면 localhost 등의 등록된 환경에서 열어주세요.
      </div>
    </div>

    <div class="modal-footer">
      <button id="cancelKeyBtn" class="hidden">취소</button>
      <button id="saveKeyBtn" class="primary">저장하고 지도 열기</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const DB_NAME = "KakaoMapAddressToolDB";
  const DB_VERSION = 1;
  const STORE_NAME = "settings";
  const KEY_NAME = "javascriptKey";

  let db = null;
  let map = null;
  let geocoder = null;
  let marker = null;
  let overlay = null;
  let sdkScript = null;
  let currentKey = "";

  const $ = (id) => document.getElementById(id);

  const mapContainer = $("map");
  const placeholder = $("mapPlaceholder");
  const status = $("status");
  const modalBackdrop = $("keyModalBackdrop");
  const keyInput = $("keyInput");
  const keyError = $("keyError");
  const saveKeyBtn = $("saveKeyBtn");
  const cancelKeyBtn = $("cancelKeyBtn");
  const changeKeyBtn = $("changeKeyBtn");

  function setStatus(message) {
    status.textContent = message;
  }

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = () => {
        const database = request.result;
        if (!database.objectStoreNames.contains(STORE_NAME)) {
          database.createObjectStore(STORE_NAME);
        }
      };

      request.onsuccess = () => {
        db = request.result;
        resolve(db);
      };

      request.onerror = () => {
        reject(request.error || new Error("IndexedDB를 열 수 없습니다."));
      };
    });
  }

  function getSetting(key) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const store = tx.objectStore(STORE_NAME);
      const request = store.get(key);

      request.onsuccess = () => resolve(request.result ?? null);
      request.onerror = () => reject(request.error || new Error("설정을 읽지 못했습니다."));
    });
  }

  function setSetting(key, value) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      const store = tx.objectStore(STORE_NAME);
      const request = store.put(value, key);

      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error || new Error("설정을 저장하지 못했습니다."));
    });
  }

  function deleteSetting(key) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      const store = tx.objectStore(STORE_NAME);
      const request = store.delete(key);

      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error || new Error("설정을 삭제하지 못했습니다."));
    });
  }

  function showKeyModal({ allowCancel = false, existingKey = "" } = {}) {
    keyError.textContent = "";
    keyInput.value = existingKey;
    cancelKeyBtn.classList.toggle("hidden", !allowCancel);
    modalBackdrop.classList.add("open");

    setTimeout(() => {
      keyInput.focus();
      keyInput.select();
    }, 0);
  }

  function hideKeyModal() {
    modalBackdrop.classList.remove("open");
  }

  function isLikelyJavaScriptKey(key) {
    // 실제 유효성은 SDK 로드 결과로 판단한다.
    return typeof key === "string" && key.trim().length >= 10;
  }

  function removePreviousSDK() {
    if (sdkScript) {
      sdkScript.remove();
      sdkScript = null;
    }

    // 이전 SDK가 남아있을 경우를 대비한 전역 참조 제거.
    try {
      delete window.kakao;
    } catch (_) {
      window.kakao = undefined;
    }
  }

  function loadKakaoSDK(appKey) {
    return new Promise((resolve, reject) => {
      removePreviousSDK();

      const script = document.createElement("script");
      sdkScript = script;

      script.type = "text/javascript";
      script.src =
        "https://dapi.kakao.com/v2/maps/sdk.js" +
        "?appkey=" + encodeURIComponent(appKey) +
        "&libraries=services" +
        "&autoload=false";

      script.onload = () => {
        if (!window.kakao || !window.kakao.maps || typeof window.kakao.maps.load !== "function") {
          reject(new Error("카카오 지도 SDK를 초기화하지 못했습니다."));
          return;
        }

        try {
          window.kakao.maps.load(() => resolve());
        } catch (error) {
          reject(error);
        }
      };

      script.onerror = () => {
        reject(new Error(
          "카카오 지도 SDK를 불러오지 못했습니다. " +
          "JavaScript Key와 등록된 도메인을 확인하세요."
        ));
      };

      document.head.appendChild(script);
    });
  }

  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function closeAddressOverlay() {
    if (overlay) {
      overlay.setMap(null);
    }
  }

  function showAddressOverlay(latLng, roadName, jibunName) {
    closeAddressOverlay();

    const lat = latLng.getLat();
    const lon = latLng.getLng();

    const content = document.createElement("div");
    content.className = "address-overlay";
    content.innerHTML = `
      <div class="heading">선택한 지점</div>
      <div class="row">
        <span class="label">도로명</span>
        ${roadName ? escapeHTML(roadName) : "없음"}
      </div>
      <div class="row">
        <span class="label">지번</span>
        ${jibunName ? escapeHTML(jibunName) : "없음"}
      </div>
      <div class="coords">
        위도 ${lat.toFixed(7)} · 경도 ${lon.toFixed(7)}
      </div>
    `;

    overlay = new kakao.maps.CustomOverlay({
      map,
      position: latLng,
      content,
      yAnchor: 1.25,
      zIndex: 20
    });
  }

  function initMap() {
    const center = new kakao.maps.LatLng(37.566826, 126.9786567);

    map = new kakao.maps.Map(mapContainer, {
      center,
      level: 8
    });

    geocoder = new kakao.maps.services.Geocoder();

    marker = new kakao.maps.Marker({
      position: center,
      map
    });

    // 브라우저 기본 우클릭 메뉴가 뜨지 않도록 한다.
    mapContainer.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    kakao.maps.event.addListener(map, "rightclick", (mouseEvent) => {
      const latLng = mouseEvent.latLng;

      marker.setPosition(latLng);
      marker.setMap(map);

      setStatus(
        `조회 중 · ${latLng.getLat().toFixed(6)}, ${latLng.getLng().toFixed(6)}`
      );

      closeAddressOverlay();

      // 현재 Kakao 지도 Web API에서는 coord2Address()를 사용합니다.
      // (coord2detailaddr()는 현재 공식 Geocoder 메서드 목록에 없습니다.)
      geocoder.coord2Address(latLng.getLng(), latLng.getLat(), (result, statusCode) => {
        if (statusCode !== kakao.maps.services.Status.OK || !result || !result[0]) {
          setStatus("주소 정보를 찾을 수 없습니다.");
          showAddressOverlay(latLng, "", "");
          return;
        }

        const first = result[0];

        // Kakao coord2Address() 결과:
        // result[0].road_address.address_name
        // result[0].address.address_name  (구 지번주소)
        const roadName = first.road_address
          ? first.road_address.address_name
          : "";

        const jibunName = first.address
          ? first.address.address_name
          : "";

        showAddressOverlay(latLng, roadName, jibunName);

        const shownAddress = roadName || jibunName || "주소 정보 없음";
        setStatus(shownAddress);
      });
    });

    // 지도 빈 공간을 클릭하면 툴팁만 닫는다.
    kakao.maps.event.addListener(map, "click", () => {
      closeAddressOverlay();
      setStatus("지도에서 우클릭하세요.");
    });

    placeholder.classList.add("hidden");
    setStatus("지도에서 우클릭하세요.");
  }

  async function startWithKey(appKey) {
    appKey = String(appKey || "").trim();

    if (!isLikelyJavaScriptKey(appKey)) {
      throw new Error("JavaScript Key를 입력하세요.");
    }

    setStatus("카카오맵 SDK를 불러오는 중...");
    placeholder.textContent = "카카오맵을 불러오는 중...";
    placeholder.classList.remove("hidden");

    try {
      await loadKakaoSDK(appKey);

      currentKey = appKey;
      hideKeyModal();

      if (map) {
        // 지도 인스턴스를 다시 만들지 않고 기존 DOM만 정리하기보다,
        // 키 변경은 페이지 수준에서 재초기화하는 것이 안전하다.
        location.reload();
        return;
      }

      initMap();
    } catch (error) {
      placeholder.textContent = "카카오맵을 불러오지 못했습니다.";
      keyError.textContent = error.message || String(error);
      throw error;
    }
  }

  saveKeyBtn.addEventListener("click", async () => {
    const key = keyInput.value.trim();

    if (!isLikelyJavaScriptKey(key)) {
      keyError.textContent = "JavaScript Key를 입력하세요.";
      keyInput.focus();
      return;
    }

    saveKeyBtn.disabled = true;
    keyError.textContent = "";

    try {
      await startWithKey(key);
      await setSetting(KEY_NAME, key);
    } catch (error) {
      // startWithKey가 실패해도 사용자가 다시 수정할 수 있게 한다.
      keyError.textContent = error.message || String(error);
      saveKeyBtn.disabled = false;
    }
  });

  keyInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      saveKeyBtn.click();
    }
  });

  cancelKeyBtn.addEventListener("click", () => {
    hideKeyModal();
  });

  changeKeyBtn.addEventListener("click", async () => {
    try {
      const existingKey = currentKey || (await getSetting(KEY_NAME)) || "";
      showKeyModal({ allowCancel: true, existingKey });
    } catch (error) {
      showKeyModal({ allowCancel: true });
      keyError.textContent = error.message || String(error);
    }
  });

  async function boot() {
    try {
      await openDB();
      const savedKey = await getSetting(KEY_NAME);

      if (savedKey) {
        currentKey = savedKey;
        await startWithKey(savedKey);
      } else {
        placeholder.textContent = "API Key를 입력하면 지도가 열립니다.";
        setStatus("API Key 입력 필요");
        showKeyModal({ allowCancel: false });
      }
    } catch (error) {
      placeholder.textContent = "초기화에 실패했습니다.";
      setStatus("초기화 오류");
      console.error(error);
    }
  }

  boot();
})();
</script>
</body>
</html>
