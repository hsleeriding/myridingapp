<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BLE 스캐너 (UUID 미지정)</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --success: #22c55e;
      --warn: #f59e0b;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      line-height: 1.5;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .sub {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.ok { background: var(--success); }
    .dot.warn { background: var(--warn); }
    .dot.err { background: var(--error); }
    .status-text { font-size: 0.95rem; }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.8; }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }
    .btn-danger {
      background: #7f1d1d;
      color: #fecaca;
    }
    .device-info {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 8px;
      word-break: break-all;
    }
    .device-info strong {
      color: var(--text);
    }
    #log {
      background: #0a0e14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      height: 320px;
      overflow-y: auto;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-line { margin-bottom: 2px; }
    .log-time { color: var(--muted); }
    .log-ok { color: var(--success); }
    .log-err { color: var(--error); }
    .log-info { color: #93c5fd; }
    .log-data { color: #fde68a; }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 10px;
    }
    .services {
      margin-top: 10px;
      max-height: 160px;
      overflow-y: auto;
      font-size: 0.8rem;
    }
    .svc {
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .svc:last-child { border-bottom: none; }
    .char {
      padding-left: 12px;
      color: var(--muted);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <h1>BLE 스캐너</h1>
  <p class="sub">UUID 미지정 · 주변 기기 전체 스캔 · 값 연속 로그</p>

  <div class="card">
    <div class="status-row">
      <div class="dot" id="supportDot"></div>
      <div class="status-text" id="supportText">브라우저 지원 확인 중…</div>
    </div>
    <div class="status-row">
      <div class="dot" id="connDot"></div>
      <div class="status-text" id="connText">연결 안 됨</div>
    </div>
    <div class="device-info" id="deviceInfo"></div>

    <div class="btn-row">
      <button class="btn-primary" id="btnScan" disabled>기기 검색 & 연결</button>
      <button class="btn-secondary" id="btnDisconnect" disabled>연결 해제</button>
      <button class="btn-secondary" id="btnClear">로그 지우기</button>
    </div>
    <p class="hint">
      HTTPS 또는 localhost에서만 동작합니다. Android Chrome 권장.<br>
      버튼 클릭 후 나타나는 목록에서 기기를 직접 선택하세요.
    </p>
  </div>

  <div class="card">
    <div style="font-size:0.9rem; margin-bottom:8px; color:var(--muted);">발견된 서비스 / 특성</div>
    <div class="services" id="servicesBox">아직 없음</div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span style="font-size:0.9rem; color:var(--muted);">수신 로그</span>
      <span style="font-size:0.75rem; color:var(--muted);" id="logCount">0줄</span>
    </div>
    <div id="log"></div>
  </div>

  <script>
    // ─── 상태 ──────────────────────────────────────────────
    let device = null;
    let server = null;
    let logLines = 0;
    const subscribed = new Set(); // characteristic 중복 구독 방지

    const $ = (id) => document.getElementById(id);
    const supportDot = $("supportDot");
    const supportText = $("supportText");
    const connDot = $("connDot");
    const connText = $("connText");
    const deviceInfo = $("deviceInfo");
    const btnScan = $("btnScan");
    const btnDisconnect = $("btnDisconnect");
    const btnClear = $("btnClear");
    const servicesBox = $("servicesBox");
    const logEl = $("log");
    const logCount = $("logCount");

    // ─── 로그 헬퍼 ─────────────────────────────────────────
    function log(msg, type = "info") {
      const now = new Date();
      const time = now.toLocaleTimeString("ko-KR", { hour12: false }) +
        "." + String(now.getMilliseconds()).padStart(3, "0");
      const line = document.createElement("div");
      line.className = "log-line";
      line.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${escapeHtml(msg)}</span>`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
      logLines++;
      logCount.textContent = logLines + "줄";
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function setSupport(ok, text) {
      supportDot.className = "dot " + (ok ? "ok" : "err");
      supportText.textContent = text;
      btnScan.disabled = !ok;
    }

    function setConn(state, text) {
      // state: "off" | "on" | "warn"
      connDot.className = "dot " + (state === "on" ? "ok" : state === "warn" ? "warn" : "");
      connText.textContent = text;
      btnDisconnect.disabled = state !== "on";
      btnScan.disabled = state === "on" || !navigator.bluetooth;
    }

    // ─── 1. 브라우저 지원 확인 ─────────────────────────────
    function checkSupport() {
      if (!navigator.bluetooth) {
        setSupport(false, "이 브라우저는 Web Bluetooth를 지원하지 않습니다 (Chrome Android 권장)");
        log("Web Bluetooth API 미지원", "err");
        return false;
      }
      setSupport(true, "Web Bluetooth 지원됨");
      log("Web Bluetooth API 사용 가능", "ok");
      return true;
    }

    // ─── 2. 기기 검색 & 연결 (UUID 미지정) ─────────────────
    async function scanAndConnect() {
      if (!navigator.bluetooth) return;

      try {
        setConn("warn", "기기 선택 창 여는 중…");
        log("기기 검색 요청 (acceptAllDevices)…", "info");

        // UUID를 특정하지 않음. 사용자가 목록에서 직접 고름.
        // optionalServices는 연결 후 서비스에 접근하기 위해 자주 쓰는 것들을 넣어둠.
        // 없어도 getPrimaryServices()는 대부분 동작함.
        device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            "generic_access",
            "generic_attribute",
            "device_information",
            "battery_service",
            "heart_rate",
            "health_thermometer",
            "blood_pressure",
            "cycling_speed_and_cadence",
            "running_speed_and_cadence",
            "environmental_sensing",
            "automation_io",
            "human_interface_device",
            "immediate_alert",
            "link_loss",
            "tx_power",
            "current_time",
            "reference_time_update",
            "next_dst_change",
            "glucose",
            "body_composition",
            "weight_scale",
            "user_data",
            // 커스텀/알 수 없는 서비스도 시도할 수 있게 자주 쓰는 128-bit 예시
            "0000ffe0-0000-1000-8000-00805f9b34fb", // 흔한 Nordic UART 계열
            "6e400001-b5a3-f393-e0a9-e50e24dcca9e", // Nordic UART Service
          ],
        });

        log(`기기 선택됨: ${device.name || "(이름 없음)"}`, "ok");
        deviceInfo.innerHTML = `<strong>${escapeHtml(device.name || "이름 없는 기기")}</strong><br>ID: ${escapeHtml(device.id)}`;

        device.addEventListener("gattserverdisconnected", onDisconnected);

        setConn("warn", "GATT 연결 중…");
        server = await device.gatt.connect();
        setConn("on", "연결됨");
        log("GATT 서버 연결 성공", "ok");

        await exploreAndSubscribe();
      } catch (err) {
        if (err.name === "NotFoundError") {
          log("기기 선택이 취소되었거나 기기를 찾지 못함", "err");
          setConn("off", "연결 안 됨");
        } else if (err.name === "SecurityError") {
          log("보안 오류: HTTPS가 아니거나 권한이 거부됨", "err");
          setConn("off", "권한/보안 오류");
        } else {
          log(`오류: ${err.name} – ${err.message}`, "err");
          setConn("off", "연결 실패");
        }
        console.error(err);
      }
    }

    // ─── 3. 서비스/특성 탐색 + 알림 구독 ───────────────────
    async function exploreAndSubscribe() {
      servicesBox.innerHTML = "";
      subscribed.clear();

      try {
        const services = await server.getPrimaryServices();
        log(`서비스 ${services.length}개 발견`, "info");

        if (services.length === 0) {
          servicesBox.textContent = "서비스를 찾지 못함 (optionalServices에 없는 UUID일 수 있음)";
          log("서비스 0개 – optionalServices에 해당 UUID를 추가해야 할 수 있음", "err");
          return;
        }

        for (const service of services) {
          const svcEl = document.createElement("div");
          svcEl.className = "svc";
          svcEl.innerHTML = `<strong>Service</strong> ${service.uuid}`;

          let chars = [];
          try {
            chars = await service.getCharacteristics();
          } catch (e) {
            log(`특성 조회 실패 (${service.uuid}): ${e.message}`, "err");
          }

          for (const char of chars) {
            const props = [];
            if (char.properties.read) props.push("read");
            if (char.properties.write) props.push("write");
            if (char.properties.writeWithoutResponse) props.push("writeNR");
            if (char.properties.notify) props.push("notify");
            if (char.properties.indicate) props.push("indicate");

            const charEl = document.createElement("div");
            charEl.className = "char";
            charEl.textContent = `↳ ${char.uuid}  [${props.join(", ") || "none"}]`;
            svcEl.appendChild(charEl);

            // notify / indicate 가능한 특성은 자동 구독
            if (char.properties.notify || char.properties.indicate) {
              await trySubscribe(char);
            }
            // read만 가능한 특성은 한 번 읽어보기
            else if (char.properties.read) {
              await tryReadOnce(char);
            }
          }
          servicesBox.appendChild(svcEl);
        }

        if (subscribed.size === 0) {
          log("알림(notify) 가능한 특성이 없습니다. read만 되는 특성은 1회 읽기만 수행했습니다.", "info");
        } else {
          log(`${subscribed.size}개 특성에 알림 구독 완료 → 값 변화 시 로그에 출력됩니다`, "ok");
        }
      } catch (err) {
        log(`서비스 탐색 오류: ${err.message}`, "err");
      }
    }

    async function trySubscribe(characteristic) {
      const key = characteristic.uuid;
      if (subscribed.has(key)) return;
      try {
        await characteristic.startNotifications();
        characteristic.addEventListener("characteristicvaluechanged", (event) => {
          const value = event.target.value;
          const hex = bufferToHex(value);
          const ascii = bufferToAscii(value);
          log(`[NOTIFY] ${characteristic.uuid}\n  hex: ${hex}\n  ascii: ${ascii}`, "data");
        });
        subscribed.add(key);
        log(`구독 성공: ${characteristic.uuid}`, "ok");
      } catch (err) {
        log(`구독 실패 (${characteristic.uuid}): ${err.message}`, "err");
      }
    }

    async function tryReadOnce(characteristic) {
      try {
        const value = await characteristic.readValue();
        const hex = bufferToHex(value);
        const ascii = bufferToAscii(value);
        log(`[READ] ${characteristic.uuid}\n  hex: ${hex}\n  ascii: ${ascii}`, "data");
      } catch (err) {
        // 권한/보안 특성은 읽을 수 없는 경우가 많음 → 조용히 패스
        log(`[READ 실패] ${characteristic.uuid}: ${err.message}`, "err");
      }
    }

    function bufferToHex(dataView) {
      const bytes = new Uint8Array(dataView.buffer, dataView.byteOffset, dataView.byteLength);
      return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join(" ");
    }

    function bufferToAscii(dataView) {
      const bytes = new Uint8Array(dataView.buffer, dataView.byteOffset, dataView.byteLength);
      return Array.from(bytes)
        .map(b => (b >= 32 && b <= 126) ? String.fromCharCode(b) : ".")
        .join("");
    }

    // ─── 4. 연결 해제 / 끊김 처리 ──────────────────────────
    function onDisconnected() {
      log("기기와의 연결이 끊어졌습니다", "err");
      setConn("off", "연결 끊김");
      server = null;
      subscribed.clear();
    }

    async function disconnect() {
      if (device && device.gatt && device.gatt.connected) {
        device.gatt.disconnect();
        log("사용자가 연결을 해제했습니다", "info");
      }
      setConn("off", "연결 안 됨");
      server = null;
      subscribed.clear();
    }

    // ─── 이벤트 바인딩 ─────────────────────────────────────
    btnScan.addEventListener("click", scanAndConnect);
    btnDisconnect.addEventListener("click", disconnect);
    btnClear.addEventListener("click", () => {
      logEl.innerHTML = "";
      logLines = 0;
      logCount.textContent = "0줄";
    });

    // 초기화
    checkSupport();
    setConn("off", "연결 안 됨");
    log("페이지 로드 완료. '기기 검색 & 연결' 버튼을 누르세요.", "info");
  </script>
</body>
</html>
